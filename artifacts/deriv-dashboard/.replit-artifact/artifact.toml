kind = "web"
previewPath = "/"
title = "Shadow Ai Trading"
description = "An admin-controlled multi-user AI trading dashboard for securely connecting individual Deriv accounts, monitoring live telemetry, and executing protected options trades."
version = "1.0.0"
id = "artifacts/deriv-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21404

[services.development]
run = "pnpm --filter @workspace/deriv-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deriv-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/deriv-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21404"
BASE_PATH = "/"
