openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: deriv
    description: Deriv account and connection operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /deriv/accounts:
    get:
      operationId: getDerivAccounts
      tags: [deriv]
      summary: Load Deriv Options accounts
      description: Loads the accounts available to the configured Deriv PAT without exposing credentials.
      responses:
        "200":
          description: Available accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DerivAccount"
        "502":
          description: Deriv account service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/status:
    get:
      operationId: getDerivStatus
      tags: [deriv]
      summary: Get Deriv connection status
      responses:
        "200":
          description: Current connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
  /deriv/test-connection:
    post:
      operationId: testDerivConnection
      tags: [deriv]
      summary: Test the Deriv REST and WebSocket connection
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivConnectionTest"
        "502":
          description: Deriv connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/proposals:
    post:
      operationId: requestDerivProposal
      tags: [deriv]
      summary: Request a Deriv proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivProposalInput"
      responses:
        "202":
          description: Proposal request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivProposalRequest"
        "400":
          description: Invalid proposal input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv WebSocket is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/select-account:
    post:
      operationId: selectDerivAccount
      tags: [deriv]
      summary: Select the account used by the authenticated WebSocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivAccountSelection"
      responses:
        "200":
          description: Account selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
        "400":
          description: Invalid account selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Unable to connect to the selected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/buy:
    post:
      operationId: buyDerivContract
      tags: [deriv]
      summary: Buy a contract after explicit live-trade confirmation
      description: Buys a previously returned proposal on a selected real account. Requires explicit confirmation and the live-trading server flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivBuyInput"
      responses:
        "202":
          description: Buy request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBuyResponse"
        "400":
          description: Invalid buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not real
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv WebSocket is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/history:
    get:
      operationId: getDerivHistory
      tags: [deriv]
      summary: Get Deriv trade history observed for real and demo accounts
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivHistoryResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DerivAccount:
      type: object
      required: [id, type, currency, balance, status]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [demo, real]
        currency:
          type: string
        balance:
          type: number
        status:
          type: string
    DerivTick:
      type: object
      required: [symbol, quote, epoch]
      properties:
        symbol:
          type: string
        quote:
          type: number
        epoch:
          type: integer
    DerivProposal:
      type: object
      required: [id, ask_price, payout, spot]
      properties:
        id:
          type: string
        ask_price:
          type: number
        payout:
          type: number
        spot:
          type: number
        longcode:
          type: [string, "null"]
    DerivStatus:
      type: object
      required: [connected, authorized, bot_running, symbol, currency, max_trade_amount]
      properties:
        connected:
          type: boolean
        authorized:
          type: boolean
        account:
          anyOf:
            - $ref: "#/components/schemas/DerivAccount"
            - type: "null"
        last_tick:
          anyOf:
            - $ref: "#/components/schemas/DerivTick"
            - type: "null"
        last_proposal:
          anyOf:
            - $ref: "#/components/schemas/DerivProposal"
            - type: "null"
        last_buy:
          anyOf:
            - $ref: "#/components/schemas/DerivBuy"
            - type: "null"
        last_contract:
          anyOf:
            - $ref: "#/components/schemas/DerivContract"
            - type: "null"
        bot_running:
          type: boolean
        symbol:
          type: string
        currency:
          type: string
        max_trade_amount:
          type: number
        live_trading_enabled:
          type: boolean
    DerivConnectionTest:
      type: object
      required: [ok, message, accounts, status]
      properties:
        ok:
          type: boolean
        message:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/DerivAccount"
        status:
          $ref: "#/components/schemas/DerivStatus"
    DerivProposalInput:
      type: object
      required: [amount, duration, duration_unit, contract_type]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
          maximum: 1000
        duration_unit:
          type: string
          enum: [t, s, m]
        contract_type:
          type: string
          enum: [DIGITEVEN, DIGITODD]
        symbol:
          type: string
    DerivProposalRequest:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    DerivAccountSelection:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: string
          minLength: 1
    DerivBuyInput:
      type: object
      required: [proposal_id, price, confirm_live_trade]
      properties:
        proposal_id:
          type: string
          minLength: 1
        price:
          type: number
          exclusiveMinimum: 0
        confirm_live_trade:
          type: boolean
          const: true
    DerivBuy:
      type: object
      required: [contract_id, buy_price, payout]
      properties:
        contract_id:
          type: string
        buy_price:
          type: number
        payout:
          type: number
        start_time:
          type: [integer, "null"]
    DerivBuyResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        buy:
          anyOf:
            - $ref: "#/components/schemas/DerivBuy"
            - type: "null"
    DerivContract:
      type: object
      required: [contract_id, status, is_sold, profit, buy_price, payout]
      properties:
        contract_id:
          type: string
        status:
          type: string
        is_sold:
          type: boolean
        profit:
          type: number
        buy_price:
          type: number
        payout:
          type: number
        sell_price:
          type: number
        entry_spot:
          type: number
        current_spot:
          type: number
        expiry_time:
          type: [integer, "null"]
    DerivHistoryItem:
      type: object
      required: [contract_id, account_id, account_type, contract_type, symbol, buy_price, payout, profit, status]
      properties:
        contract_id:
          type: string
        account_id:
          type: string
        account_type:
          type: string
          enum: [demo, real]
        contract_type:
          type: string
        symbol:
          type: string
        buy_price:
          type: number
        payout:
          type: number
        profit:
          type: number
        status:
          type: string
        buy_time:
          type: [integer, "null"]
        sell_time:
          type: [integer, "null"]
    DerivHistoryResponse:
      type: array
      items:
        $ref: "#/components/schemas/DerivHistoryItem"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

