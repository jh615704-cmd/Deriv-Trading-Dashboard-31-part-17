openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - guestSession: []
tags:
  - name: health
    description: Health operations
  - name: deriv
    description: Deriv account and connection operations
  - name: token
    description: Deriv credential management
  - name: auth
    description: Current approved access
  - name: admin
    description: Administrator user management
  - name: access
    description: Access-key sessions and administrator access controls
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/access:
    get:
      security:
        - clerkSession: []
      operationId: getAuthAccess
      tags: [auth]
      summary: Get approved access for the current user
      responses:
        "200":
          description: Current approved identity and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccess"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in but not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      security:
        - clerkSession: []
      operationId: listAdminUsers
      tags: [admin]
      summary: List approved users
      responses:
        "200":
          description: Approved users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedUser"
    post:
      security:
        - clerkSession: []
      operationId: createAdminUser
      tags: [admin]
      summary: Create an approved Clerk user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedUser"
        "400":
          description: Invalid user or duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/login:
    post:
      security: []
      operationId: loginAccessKey
      tags: [access]
      summary: Open an access-key session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyLoginInput"
      responses:
        "200":
          description: Access session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSession"
        "400":
          description: Invalid access-key input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Access key not recognized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access key paused, blocked, banned, or at its device limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/session:
    get:
      security:
        - accessSession: []
      operationId: getAccessSession
      tags: [access]
      summary: Get the current access-key session
      responses:
        "200":
          description: Current access session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSession"
        "401":
          description: Access key session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/heartbeat:
    post:
      security:
        - accessSession: []
      operationId: heartbeatAccessSession
      tags: [access]
      summary: Update access-key presence
      responses:
        "200":
          description: Presence updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /access/logout:
    post:
      security:
        - accessSession: []
      operationId: logoutAccessSession
      tags: [access]
      summary: Close the current access-key session
      responses:
        "200":
          description: Session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /access/trading-protection:
    get:
      security:
        - accessSession: []
      operationId: getTradingProtection
      tags: [access]
      summary: Read administrator trading protection settings
      responses:
        "200":
          description: Global trading protection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingProtectionSettings"
        "403":
          description: Primary administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      security:
        - accessSession: []
      operationId: updateTradingProtection
      tags: [access]
      summary: Update administrator trading protection settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingProtectionSettingsUpdate"
      responses:
        "200":
          description: Updated global trading protection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingProtectionSettings"
        "403":
          description: Primary administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/keys:
    get:
      security:
        - accessSession: []
      operationId: listAccessKeys
      tags: [access]
      summary: List access keys for administrators
      responses:
        "200":
          description: Access keys and presence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessKeySummary"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      security:
        - accessSession: []
      operationId: createAccessKey
      tags: [access]
      summary: Create a user or administrator access key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyCreateInput"
      responses:
        "201":
          description: Access key created; the raw key is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeyCreated"
        "400":
          description: Invalid access-key settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The access-key label is already reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/keys/{id}:
    patch:
      security:
        - accessSession: []
      operationId: updateAccessKey
      tags: [access]
      summary: Pause, block, ban, or update an access key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyUpdateInput"
      responses:
        "200":
          description: Access key updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeySummary"
        "400":
          description: Invalid or irreversible access-key update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      security:
        - accessSession: []
      operationId: deleteAccessKey
      tags: [access]
      summary: Delete an access key permanently
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Access key deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: The primary administrator key cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access/keys/{id}/reset:
    post:
      security:
        - accessSession: []
      operationId: resetAccessKey
      tags: [access]
      summary: Issue a replacement access key
      description: Replaces an existing non-primary access key, revokes its sessions, and returns the new raw key only once.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Replacement access key; the raw key is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeyCreated"
        "400":
          description: The primary administrator key cannot be replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /token/test:
    post:
      operationId: testDerivToken
      tags: [token]
      summary: Validate and save a Deriv personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivTokenInput"
      responses:
        "200":
          description: Validated token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivTokenTestResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /token/status:
    get:
      operationId: getDerivTokenStatus
      tags: [token]
      summary: Get saved Deriv token metadata
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivTokenStatus"
  /token:
    delete:
      operationId: deleteDerivToken
      tags: [token]
      summary: Remove saved Deriv token
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDeleteResponse"
  /deriv/accounts:
    get:
      operationId: getDerivAccounts
      tags: [deriv]
      summary: Load Deriv Options accounts
      description: Loads the accounts available to the configured Deriv PAT without exposing credentials.
      responses:
        "200":
          description: Available accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DerivAccount"
        "502":
          description: Deriv account service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/status:
    get:
      operationId: getDerivStatus
      tags: [deriv]
      summary: Get Deriv connection status
      responses:
        "200":
          description: Current connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
  /deriv/test-connection:
    post:
      operationId: testDerivConnection
      tags: [deriv]
      summary: Test the Deriv REST and WebSocket connection
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivConnectionTest"
        "502":
          description: Deriv connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/proposals:
    post:
      operationId: requestDerivProposal
      tags: [deriv]
      summary: Request a Deriv proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivProposalInput"
      responses:
        "202":
          description: Proposal request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivProposalRequest"
        "400":
          description: Invalid proposal input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/select-account:
    post:
      operationId: selectDerivAccount
      tags: [deriv]
      summary: Select the account used by the authenticated WebSocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivAccountSelection"
      responses:
        "200":
          description: Account selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
        "400":
          description: Invalid account selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/select-symbol:
    post:
      operationId: selectDerivSymbol
      tags: [deriv]
      summary: Select the market used for live digit telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivSymbolSelection"
      responses:
        "200":
          description: Selected market status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
        "400":
          description: Unsupported market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Unable to connect to the selected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/buy:
    post:
      operationId: buyDerivContract
      tags: [deriv]
      summary: Request a fresh proposal and buy immediately
      description: Requests a fresh proposal for the selected duration and digit contract, then buys it immediately. Real accounts require explicit confirmation and the live-trading server flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivBuyInput"
      responses:
        "202":
          description: Buy request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBuyResponse"
        "400":
          description: Invalid buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Buy cooldown is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/bulk-buy:
    post:
      operationId: bulkBuyDerivContracts
      tags: [deriv]
      summary: Buy a batch of digit contracts immediately
      description: Requests and sends 1 to 6 contracts without the single-trade cooldown. The total requested stake must fit within the selected account balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivBulkBuyInput"
      responses:
        "202":
          description: Bulk buy requests accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBulkBuyResponse"
        "400":
          description: Invalid bulk buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/sell:
    post:
      operationId: sellDerivContract
      tags: [deriv]
      summary: Close an open Deriv contract at the current sell price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivSellInput"
      responses:
        "200":
          description: Contract close confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivSellResponse"
        "400":
          description: Invalid contract close request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not confirm the contract close
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/dual-buy:
    post:
      operationId: dualBuyDerivContracts
      tags: [deriv]
      summary: Buy one Over and one Under contract as a single action
      description: Requests and sends one Over and one Under digit contract without the single-trade cooldown. The pair uses the selected barrier and stake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivDualBuyInput"
      responses:
        "202":
          description: Dual buy requests accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBulkBuyResponse"
        "400":
          description: Invalid dual buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Deriv did not return a proposal after connection recovery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/history:
    get:
      operationId: getDerivHistory
      tags: [deriv]
      summary: Get Deriv trade history observed for real and demo accounts
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivHistoryResponse"
    delete:
      operationId: clearDerivHistory
      tags: [deriv]
      summary: Clear recent trade rows from the dashboard
      description: Clears the dashboard's locally held recent rows. This does not delete records from Deriv.
      responses:
        "200":
          description: Recent rows cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivHistoryClearResponse"
components:
  securitySchemes:
    guestSession:
      type: apiKey
      in: cookie
      name: jdy_guest
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie
    accessSession:
      type: apiKey
      in: cookie
      name: jdy_access
      description: HttpOnly access-key session cookie
  schemas:
    AuthAccess:
      type: object
      required: [user_id, email, role]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
    ApprovedUser:
      type: object
      required: [user_id, email, role, active, created_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminUserInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
    AccessKeyLoginInput:
      type: object
      required: [access_key, device_id]
      properties:
        access_key: { type: string, minLength: 12, maxLength: 200 }
        device_id: { type: string, minLength: 8, maxLength: 200 }
    AccessKeyCreateInput:
      type: object
      required: [label, kind, max_devices, features]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [admin, user] }
        max_devices:
          type: integer
          minimum: 0
          maximum: 50
          description: "Maximum active devices; 0 means unlimited and is allowed only for administrator keys."
        features:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AccessFeature"
    AccessKeyUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [active, paused, blocked, banned, deleted] }
        max_devices:
          type: integer
          minimum: 0
          maximum: 50
          description: "Maximum active devices; 0 means unlimited and is allowed only for administrator keys."
        features:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AccessFeature"
    AccessFeature:
      type: string
      enum: [edge, digit-flip, trade-x, bulk-trader, cash-grab, money-bank, jdy-ai-3, settings, history, admin]
    AccessSession:
      type: object
      required: [key_id, key_prefix, label, kind, is_admin, status, max_devices, features, online, last_seen_at]
      properties:
        key_id: { type: string, format: uuid }
        key_prefix: { type: string }
        label: { type: string }
        kind: { type: string, enum: [admin, user] }
        is_admin: { type: boolean }
        status: { type: string, enum: [active, paused, blocked, banned] }
        max_devices: { type: integer }
        features:
          type: array
          items:
            $ref: "#/components/schemas/AccessFeature"
        online: { type: boolean }
        last_seen_at: { type: ["string", "null"], format: date-time }
    AccessKeySummary:
      allOf:
        - $ref: "#/components/schemas/AccessSession"
        - type: object
          required: [access_key, device_count, online_devices, offline_seconds, created_at]
          properties:
            access_key: { type: ["string", "null"] }
            device_count: { type: integer }
            online_devices: { type: integer }
            offline_seconds: { type: integer }
            created_at: { type: string, format: date-time }
    AccessKeyCreated:
      allOf:
        - $ref: "#/components/schemas/AccessSession"
        - type: object
          required: [access_key]
          properties:
            access_key: { type: string }
    TradingProtectionSettings:
      type: object
      required: [weekdays_enabled, weekends_enabled, dual_weekends_weekdays_enabled, updated_at]
      properties:
        weekdays_enabled: { type: boolean }
        weekends_enabled: { type: boolean }
        dual_weekends_weekdays_enabled: { type: boolean }
        updated_at: { type: ["string", "null"], format: date-time }
    TradingProtectionSettingsUpdate:
      type: object
      required: [weekdays_enabled, weekends_enabled, dual_weekends_weekdays_enabled]
      properties:
        weekdays_enabled: { type: boolean }
        weekends_enabled: { type: boolean }
        dual_weekends_weekdays_enabled: { type: boolean }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    DerivTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
        expires_at:
          type: ["string", "null"]
          format: date
    DerivTokenStatus:
      type: object
      required: [has_token, expires_at, last_verified_at]
      properties:
        has_token: { type: boolean }
        expires_at: { type: ["string", "null"] }
        last_verified_at: { type: ["string", "null"], format: date-time }
    TokenDeleteResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    DerivTokenTestResponse:
      type: object
      required: [success, message, accounts]
      properties:
        success: { type: boolean }
        message: { type: string }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/DerivAccount" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DerivAccount:
      type: object
      required: [id, type, currency, balance, status]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [demo, real]
        currency:
          type: string
        balance:
          type: number
        status:
          type: string
    DerivTick:
      type: object
      required: [symbol, quote, epoch]
      properties:
        symbol:
          type: string
        quote:
          type: number
        epoch:
          type: integer
    DerivProposal:
      type: object
      required: [id, ask_price, payout, spot]
      properties:
        id:
          type: string
        ask_price:
          type: number
        payout:
          type: number
        spot:
          type: number
        longcode:
          type: [string, "null"]
    DerivStatus:
      type: object
      required: [connected, authorized, bot_running, symbol, currency, max_trade_amount, market_signals]
      properties:
        connected:
          type: boolean
        authorized:
          type: boolean
        account:
          anyOf:
            - $ref: "#/components/schemas/DerivAccount"
            - type: "null"
        last_tick:
          anyOf:
            - $ref: "#/components/schemas/DerivTick"
            - type: "null"
        last_proposal:
          anyOf:
            - $ref: "#/components/schemas/DerivProposal"
            - type: "null"
        last_buy:
          anyOf:
            - $ref: "#/components/schemas/DerivBuy"
            - type: "null"
        last_contract:
          anyOf:
            - $ref: "#/components/schemas/DerivContract"
            - type: "null"
        bot_running:
          type: boolean
        symbol:
          type: string
        currency:
          type: string
        max_trade_amount:
          type: number
        live_trading_enabled:
          type: boolean
        digit_even_percentage:
          type: number
        digit_odd_percentage:
          type: number
        digit_sample_count:
          type: integer
        last_digit:
          type: [integer, "null"]
          minimum: 0
          maximum: 9
        digit_history:
          type: array
          maxItems: 50
          items:
            type: integer
            minimum: 0
            maximum: 9
        digit_streaks:
          type: array
          items:
            $ref: "#/components/schemas/DigitStreak"
        market_signals:
          type: array
          items:
            $ref: "#/components/schemas/DerivMarketSignal"
    DigitStreak:
      type: object
      required: [digit, over, under]
      properties:
        digit:
          type: integer
          minimum: 0
          maximum: 9
        over:
          type: integer
          minimum: 0
        under:
          type: integer
          minimum: 0
    DerivMarketSignal:
      type: object
      required: [symbol, quote, last_digit, sample_count, digit_even_percentage, digit_odd_percentage, rise_percentage, fall_percentage, digit_streaks, digit_outcomes]
      properties:
        symbol:
          type: string
        quote:
          anyOf:
            - type: number
            - type: "null"
        last_digit:
          type: [integer, "null"]
          minimum: 0
          maximum: 9
        sample_count:
          type: integer
          minimum: 0
        digit_even_percentage:
          type: number
          minimum: 0
          maximum: 100
        digit_odd_percentage:
          type: number
          minimum: 0
          maximum: 100
        rise_percentage:
          type: number
          minimum: 0
          maximum: 100
        fall_percentage:
          type: number
          minimum: 0
          maximum: 100
        digit_streaks:
          type: array
          items:
            $ref: "#/components/schemas/DigitStreak"
        digit_outcomes:
          type: array
          items:
            $ref: "#/components/schemas/DigitOutcome"
    DigitOutcome:
      type: object
      required: [digit, over_percentage, under_percentage]
      properties:
        digit:
          type: integer
          minimum: 0
          maximum: 9
        over_percentage:
          type: number
          minimum: 0
          maximum: 100
        under_percentage:
          type: number
          minimum: 0
          maximum: 100
    DerivConnectionTest:
      type: object
      required: [ok, message, accounts, status]
      properties:
        ok:
          type: boolean
        message:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/DerivAccount"
        status:
          $ref: "#/components/schemas/DerivStatus"
    DerivProposalInput:
      type: object
      required: [amount, duration, duration_unit, contract_type]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
          maximum: 1000
        duration_unit:
          type: string
          enum: [t, s, m]
        contract_type:
          type: string
          enum: [DIGITEVEN, DIGITODD, DIGITOVER, DIGITUNDER, DIGITDIFF, CALL, PUT, ACCU]
        barrier:
          type: integer
          minimum: 0
          maximum: 9
        growth_rate:
          type: number
          minimum: 0.01
          maximum: 0.05
        symbol:
          type: string
    DerivProposalRequest:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    DerivAccountSelection:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: string
          minLength: 1
    DerivSymbolSelection:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
          minLength: 1
    DerivBuyInput:
      type: object
      required: [amount, duration, duration_unit, contract_type, confirm_live_trade]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
          maximum: 50
        duration_unit:
          type: string
          enum: [t]
        contract_type:
          type: string
          enum: [DIGITEVEN, DIGITODD, DIGITOVER, DIGITUNDER, DIGITDIFF, CALL, PUT, ACCU]
        barrier:
          type: integer
          minimum: 0
          maximum: 9
        growth_rate:
          type: number
          minimum: 0.01
          maximum: 0.05
        symbol:
          type: string
        confirm_live_trade:
          type: boolean
          const: true
    DerivBulkBuyInput:
      type: object
      required: [amount, duration, duration_unit, contract_type, count, confirm_live_trade]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
          maximum: 10
          description: Tick duration; CALL and PUT allow 1–10, other contract types are limited to 1–5.
        duration_unit:
          type: string
          enum: [t]
        contract_type:
          type: string
          enum: [DIGITEVEN, DIGITODD, DIGITOVER, DIGITUNDER, DIGITDIFF, CALL, PUT, ACCU]
        barrier:
          type: integer
          minimum: 0
          maximum: 9
        growth_rate:
          type: number
          minimum: 0.01
          maximum: 0.05
        symbol:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 6
        confirm_live_trade:
          type: boolean
          const: true
    DerivDualBuyInput:
      type: object
      required: [amount, duration, duration_unit, barrier, confirm_live_trade]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
        duration_unit:
          type: string
          enum: [t]
        barrier:
          type: integer
          minimum: 0
          maximum: 9
        symbol:
          type: string
        confirm_live_trade:
          type: boolean
          const: true
    DerivBuy:
      type: object
      required: [contract_id, buy_price, payout]
      properties:
        contract_id:
          type: string
        buy_price:
          type: number
        payout:
          type: number
        start_time:
          type: [integer, "null"]
    DerivBuyResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        proposal:
          anyOf:
            - $ref: "#/components/schemas/DerivProposal"
            - type: "null"
        buy:
          anyOf:
            - $ref: "#/components/schemas/DerivBuy"
            - type: "null"
    DerivSellInput:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: string
          minLength: 1
    DerivSellResponse:
      type: object
      required: [ok, contract_id, sold_for]
      properties:
        ok:
          type: boolean
        contract_id:
          type: string
        sold_for:
          type: number
    DerivBulkBuyResponse:
      type: object
      required: [ok, message, count, proposals, buys]
      properties:
        ok:
          type: boolean
        message:
          type: string
        count:
          type: integer
