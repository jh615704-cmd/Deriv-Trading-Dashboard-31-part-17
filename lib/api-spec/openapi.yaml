openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - clerkSession: []
tags:
  - name: health
    description: Health operations
  - name: deriv
    description: Deriv account and connection operations
  - name: token
    description: Deriv credential management
  - name: auth
    description: Current approved access
  - name: admin
    description: Administrator user management
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/access:
    get:
      operationId: getAuthAccess
      tags: [auth]
      summary: Get approved access for the current user
      responses:
        "200":
          description: Current approved identity and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccess"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in but not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List approved users
      responses:
        "200":
          description: Approved users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedUser"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create an approved Clerk user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedUser"
        "400":
          description: Invalid user or duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /token/test:
    post:
      operationId: testDerivToken
      tags: [token]
      summary: Validate and save a Deriv personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivTokenInput"
      responses:
        "200":
          description: Validated token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivTokenTestResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /token/status:
    get:
      operationId: getDerivTokenStatus
      tags: [token]
      summary: Get saved Deriv token metadata
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivTokenStatus"
  /token:
    delete:
      operationId: deleteDerivToken
      tags: [token]
      summary: Remove saved Deriv token
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDeleteResponse"
  /deriv/accounts:
    get:
      operationId: getDerivAccounts
      tags: [deriv]
      summary: Load Deriv Options accounts
      description: Loads the accounts available to the configured Deriv PAT without exposing credentials.
      responses:
        "200":
          description: Available accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DerivAccount"
        "502":
          description: Deriv account service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/status:
    get:
      operationId: getDerivStatus
      tags: [deriv]
      summary: Get Deriv connection status
      responses:
        "200":
          description: Current connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
  /deriv/test-connection:
    post:
      operationId: testDerivConnection
      tags: [deriv]
      summary: Test the Deriv REST and WebSocket connection
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivConnectionTest"
        "502":
          description: Deriv connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/proposals:
    post:
      operationId: requestDerivProposal
      tags: [deriv]
      summary: Request a Deriv proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivProposalInput"
      responses:
        "202":
          description: Proposal request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivProposalRequest"
        "400":
          description: Invalid proposal input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv WebSocket is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/select-account:
    post:
      operationId: selectDerivAccount
      tags: [deriv]
      summary: Select the account used by the authenticated WebSocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivAccountSelection"
      responses:
        "200":
          description: Account selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivStatus"
        "400":
          description: Invalid account selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Unable to connect to the selected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/buy:
    post:
      operationId: buyDerivContract
      tags: [deriv]
      summary: Request a fresh proposal and buy immediately
      description: Requests a fresh proposal for the selected duration and digit contract, then buys it immediately. Real accounts require explicit confirmation and the live-trading server flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivBuyInput"
      responses:
        "202":
          description: Buy request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivBuyResponse"
        "400":
          description: Invalid buy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Live trading is disabled or the selected account is not allowed to buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Buy cooldown is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deriv WebSocket is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deriv/history:
    get:
      operationId: getDerivHistory
      tags: [deriv]
      summary: Get Deriv trade history observed for real and demo accounts
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivHistoryResponse"
    delete:
      operationId: clearDerivHistory
      tags: [deriv]
      summary: Clear recent trade rows from the dashboard
      description: Clears the dashboard's locally held recent rows. This does not delete records from Deriv.
      responses:
        "200":
          description: Recent rows cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivHistoryClearResponse"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie
  schemas:
    AuthAccess:
      type: object
      required: [user_id, email, role]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
    ApprovedUser:
      type: object
      required: [user_id, email, role, active, created_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminUserInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
    DerivTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
        expires_at:
          type: ["string", "null"]
          format: date
    DerivTokenStatus:
      type: object
      required: [has_token, expires_at, last_verified_at]
      properties:
        has_token: { type: boolean }
        expires_at: { type: ["string", "null"] }
        last_verified_at: { type: ["string", "null"], format: date-time }
    TokenDeleteResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    DerivTokenTestResponse:
      type: object
      required: [success, message, accounts]
      properties:
        success: { type: boolean }
        message: { type: string }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/DerivAccount" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DerivAccount:
      type: object
      required: [id, type, currency, balance, status]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [demo, real]
        currency:
          type: string
        balance:
          type: number
        status:
          type: string
    DerivTick:
      type: object
      required: [symbol, quote, epoch]
      properties:
        symbol:
          type: string
        quote:
          type: number
        epoch:
          type: integer
    DerivProposal:
      type: object
      required: [id, ask_price, payout, spot]
      properties:
        id:
          type: string
        ask_price:
          type: number
        payout:
          type: number
        spot:
          type: number
        longcode:
          type: [string, "null"]
    DerivStatus:
      type: object
      required: [connected, authorized, bot_running, symbol, currency, max_trade_amount]
      properties:
        connected:
          type: boolean
        authorized:
          type: boolean
        account:
          anyOf:
            - $ref: "#/components/schemas/DerivAccount"
            - type: "null"
        last_tick:
          anyOf:
            - $ref: "#/components/schemas/DerivTick"
            - type: "null"
        last_proposal:
          anyOf:
            - $ref: "#/components/schemas/DerivProposal"
            - type: "null"
        last_buy:
          anyOf:
            - $ref: "#/components/schemas/DerivBuy"
            - type: "null"
        last_contract:
          anyOf:
            - $ref: "#/components/schemas/DerivContract"
            - type: "null"
        bot_running:
          type: boolean
        symbol:
          type: string
        currency:
          type: string
        max_trade_amount:
          type: number
        live_trading_enabled:
          type: boolean
        digit_even_percentage:
          type: number
        digit_odd_percentage:
          type: number
        digit_sample_count:
          type: integer
    DerivConnectionTest:
      type: object
      required: [ok, message, accounts, status]
      properties:
        ok:
          type: boolean
        message:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/DerivAccount"
        status:
          $ref: "#/components/schemas/DerivStatus"
    DerivProposalInput:
      type: object
      required: [amount, duration, duration_unit, contract_type]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
          maximum: 1000
        duration_unit:
          type: string
          enum: [t, s, m]
        contract_type:
          type: string
          enum: [DIGITEVEN, DIGITODD]
        symbol:
          type: string
    DerivProposalRequest:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    DerivAccountSelection:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: string
          minLength: 1
    DerivBuyInput:
      type: object
      required: [amount, duration, duration_unit, contract_type, confirm_live_trade]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        duration:
          type: integer
          minimum: 1
          maximum: 5
        duration_unit:
          type: string
          enum: [t]
        contract_type:
          type: string
          enum: [DIGITEVEN, DIGITODD]
        symbol:
          type: string
        confirm_live_trade:
          type: boolean
          const: true
    DerivBuy:
      type: object
      required: [contract_id, buy_price, payout]
      properties:
        contract_id:
          type: string
        buy_price:
          type: number
        payout:
          type: number
        start_time:
          type: [integer, "null"]
    DerivBuyResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        proposal:
          anyOf:
            - $ref: "#/components/schemas/DerivProposal"
            - type: "null"
        buy:
          anyOf:
            - $ref: "#/components/schemas/DerivBuy"
            - type: "null"
    DerivContract:
      type: object
      required: [contract_id, status, is_sold, profit, buy_price, payout]
      properties:
        contract_id:
          type: string
        status:
          type: string
        is_sold:
          type: boolean
        profit:
          type: number
        buy_price:
          type: number
        payout:
          type: number
        sell_price:
          type: number
        entry_spot:
          type: number
        current_spot:
          type: number
        expiry_time:
          type: [integer, "null"]
    DerivHistoryItem:
      type: object
      required: [contract_id, account_id, account_type, contract_type, symbol, buy_price, payout, profit, status]
      properties:
        contract_id:
          type: string
        account_id:
          type: string
        account_type:
          type: string
          enum: [demo, real]
        contract_type:
          type: string
        symbol:
          type: string
        buy_price:
          type: number
        payout:
          type: number
        profit:
          type: number
        status:
          type: string
        buy_time:
          type: [integer, "null"]
        sell_time:
          type: [integer, "null"]
    DerivHistoryResponse:
      type: array
      items:
        $ref: "#/components/schemas/DerivHistoryItem"
    DerivHistoryClearResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

